<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    background:#0b1220;
    color:white;
    text-align:center;
    margin-top:120px;
    font-family:Arial;
}

input {
    width:250px;
    padding:10px;
    margin:10px;
    border-radius:8px;
    border:none;
}

button {
    width:270px;
    padding:10px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:8px;
}
</style>

</head>
<body>

<h1>RBAC LOGIN</h1>

<form method="POST">
    <input name="username" placeholder="Username"><br>
    <input type="password" name="password" placeholder="Password"><br>
    <button type="submit">Login</button>
</form>

</body>
</html>
