<!DOCTYPE html>
<html>
<head>
<title>Developer Dashboard</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.sidebar {
    width:220px;
    height:100vh;
    background:#111827;
    position:fixed;
    padding:20px;
}

.main {
    margin-left:240px;
    padding:20px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card {
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}
</style>

</head>
<body>

<div class="sidebar">
<h2>DEV</h2>
<a href="/dashboard">Dashboard</a>
<a href="/logout">Logout</a>
</div>

<div class="main">

<h1>Welcome {{ user }} (DEV)</h1>

<div class="grid">
<div class="card">💻 Projects</div>
<div class="card">🧠 Tasks</div>
<div class="card">🚀 Deployments</div>
<div class="card">🐞 Bugs</div>
<div class="card">📦 Repos</div>
<div class="card">📡 APIs</div>
</div>

</div>

</body>
</html>
